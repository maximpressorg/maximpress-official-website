name: Deploy MaxImpress to Firebase Hosting (production)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the static website package before releasing
        shell: bash
        run: |
          test -n "${{ vars.FIREBASE_PROJECT_ID }}"
          test -f public/index.html
          test -f public/assets/site.css
          test -f public/assets/site.js
          test ! -f public/account.html
          test ! -f public/admin.html
          test ! -f public/dashboard.html
      - name: Authenticate Firebase deployment
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy static site to live Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
          entryPoint: .

name: Deploy MaxImpress to Firebase Hosting (production)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify project values configured before releasing
        shell: bash
        run: |
          test -n "${{ vars.FIREBASE_PROJECT_ID }}"
          ! grep -q 'REPLACE_WITH_' public/assets/firebase-config.js
          ! grep -q 'REPLACE_WITH_' public/assets/analytics-config.js
          ! grep -q 'https://maximpress.pages.dev' public/sitemap.xml
          ! grep -q 'https://maximpress.pages.dev' public/index.html
      - name: Authenticate Firebase deployment
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy Firestore access rules and indexes
        run: npx --yes firebase-tools@15.34.2 deploy --only firestore:rules,firestore:indexes --project "${{ vars.FIREBASE_PROJECT_ID }}" --non-interactive
      - name: Deploy static site to live Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
          entryPoint: .

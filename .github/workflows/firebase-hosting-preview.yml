name: Preview MaxImpress Firebase Hosting on pull request
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the static website package before preview
        shell: bash
        run: |
          test -n "${{ vars.FIREBASE_PROJECT_ID }}"
          test -f public/index.html
          test -f public/assets/site.css
          test -f public/assets/site.js
          test ! -f public/account.html
          test ! -f public/admin.html
          test ! -f public/dashboard.html
      - name: Deploy safe preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          expires: 7d
          entryPoint: .

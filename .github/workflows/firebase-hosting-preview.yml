name: Preview MaxImpress Firebase Hosting on pull request
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify project values configured before preview
        shell: bash
        run: |
          test -n "${{ vars.FIREBASE_PROJECT_ID }}"
          ! grep -q 'REPLACE_WITH_' public/assets/firebase-config.js
          ! grep -q 'REPLACE_WITH_' public/assets/analytics-config.js
          ! grep -q 'https://maximpress.pages.dev' public/sitemap.xml
          ! grep -q 'https://maximpress.pages.dev' public/index.html
      - name: Deploy safe preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          expires: 7d
          entryPoint: .
